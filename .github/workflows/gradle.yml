# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  remote-extension:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Check, test and package the extension
      working-directory: vscode
      run: |
        npm install
        npm run check
        npm test
        npm run package
    - uses: actions/upload-artifact@v4
      with:
        name: igv-remote-vsix
        path: vscode/*.vsix

  remote-runtime:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Unit tests and IGV distribution
      run: |
        python3 -m unittest discover -s remote/test -v
        sh gradlew createDist
    - name: Install dependencies as the ordinary runner user, without sudo
      run: sh remote/install.sh --prefix "$RUNNER_TEMP/igv-remote"
    - name: Verify repeat installation with the pinned dependency cache
      run: sh remote/install.sh --prefix "$RUNNER_TEMP/igv-remote"
    - name: Verify an actual server-rendered IGV session
      run: python3 remote/test/smoke.py --prefix "$RUNNER_TEMP/igv-remote" --igv-dir build/IGV-dist
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: remote-logs-${{ matrix.os }}
        path: ${{ runner.temp }}/igv-remote/run/**/*.log
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    - name: Test with Gradle Wrapper
      run: ./gradlew test


  dependency-submission:

    # The dependency graph can only be submitted with a writable token, which is
    # never granted to workflows triggered by a pull request from a fork.
    if: github.event_name == 'push'

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
